[project]
name = "hlagent-sdk"
version = "0.1.0"
requires-python = ">=3.10"
description = "HLAgent SDK — WebBackendHost wrapper over OpenHarness"

dependencies = [
    "openharness-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hlagent_sdk"]
