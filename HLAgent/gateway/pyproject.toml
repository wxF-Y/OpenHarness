[project]
name = "hlagent-gateway"
version = "0.1.0"
requires-python = ">=3.10"
description = "HLAgent Gateway — FastAPI WebSocket + REST server"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "croniter>=3.0.0",
    "hlagent-sdk",
    "openharness-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers", "services"]
