[project]
name = "hlagent-gateway"
version = "0.1.0"
requires-python = ">=3.10"
description = "HLAgent Gateway — FastAPI WebSocket + REST server"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "croniter>=3.0.0",
    "hlagent-sdk",
    "openharness-ai",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.3",
    "tiktoken>=0.7",
    "huggingface_hub>=0.24",
    "aiosqlite>=0.20",
    "pathspec>=0.12",
    "cachetools>=5.3",
    "respx>=0.21",
    "tenacity>=8.0",
    "pytest-asyncio>=0.23",
    "watchdog>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers", "services"]
